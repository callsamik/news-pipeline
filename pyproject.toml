[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-pipeline"
version = "0.1.0a1"
description = "Generic news fetch/parse/dedupe/freshness/summarize pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4"
dependencies = [
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
]

[project.optional-dependencies]
# Optional StateGraph adapter (parity with plain run_pipeline):
#   pip install "news-pipeline[graph]"
# LLM access stays external (implements LLMClient Protocol), e.g.:
#   pip install "git+https://github.com/callsamik/multiprovider-llm.git"
graph = [
  "langgraph>=1.0,<2",
]
# LangGraph listed directly (do not self-reference news-pipeline[graph]).
dev = [
  "pytest>=8.0",
  "respx>=0.21",
  "langgraph>=1.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/news_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
