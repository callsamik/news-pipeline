[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-pipeline"
version = "0.1.0a1"
description = "Generic news fetch/parse/dedupe/freshness/summarize pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4"
dependencies = [
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
  "langgraph>=1.0,<2",
]

[project.optional-dependencies]
# Production LLM access: install multiprovider-llm separately (implements LLMClient).
#   pip install "git+https://github.com/callsamik/multiprovider-llm.git"
llm = []
dev = [
  "pytest>=8.0",
  "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/news_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
